# Phase 1 Configuration: Volume Filter + RSI Filter
# Enhanced Bollinger Band Squeeze Strategy - MVP
# User Stories: US1 (Volume), US2 (RSI)
# Expected Metrics: 55-60% win rate, +5-8% annual return

# Portfolio Settings
seed_money: 10000000  # Initial capital (10 million KRW)

# Stock Selection
stocks:
  - "005930"  # Samsung Electronics
  - "000660"  # SK Hynix

# Backtest Period
date_range:
  start: "2025-01-01"
  end: "2025-09-30"

# Bollinger Band Parameters (baseline strategy)
bollinger_period: 20
bollinger_std_dev: 2.0

# Squeeze Detection
squeeze_threshold_percent: 30.0
squeeze_lookback_days: 10

# Risk Management (baseline)
stop_loss_percent: 5.0
max_position_percent: 30.0
max_positions: 5

# Advanced Settings
risk_free_rate: 0.03
transaction_cost_percent: 0.0

# ========================================================================
# Enhanced Strategy Configuration (Phase 1)
# ========================================================================

enhanced_strategy:
  # Volume Filter (User Story 1)
  volume_filter:
    enabled: true              # Enable volume spike detection
    window_days: 20            # 20-day rolling average
    multiplier: 1.5            # Require 1.5x average volume

  # RSI Filter (User Story 2)
  rsi:
    enabled: true              # Enable RSI filter
    period: 14                 # Standard 14-day RSI
    overbought: 70             # Avoid entry when RSI >= 70
    oversold: 30               # Oversold threshold

  # MACD Filter (Phase 2 - disabled for now)
  macd:
    enabled: false             # Will be enabled in Phase 2
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # ATR Dynamic Stop-Loss (Phase 4 - disabled for now)
  atr:
    enabled: false             # Will be enabled in Phase 4
    period: 14
    multiplier: 2.0

  # Confidence Scoring (Phase 3)
  confidence:
    threshold: 60              # Minimum confidence to enter (0-100)
    scoring:
      base_score: 25           # Bollinger breakout base
      volume_score: 25         # Volume filter pass
      rsi_score: 20            # RSI filter pass
      macd_score: 30           # MACD filter pass (Phase 2)
