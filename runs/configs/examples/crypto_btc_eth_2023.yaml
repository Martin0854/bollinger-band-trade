# Cryptocurrency Backtest Configuration
# Market: Bitcoin (BTC) and Ethereum (ETH) vs USDT
# Period: Full Year 2023
# Strategy: Bollinger Band Squeeze Breakout with Volume Confirmation

# Portfolio Settings
seed_money: 10000  # Starting capital: $10,000 USDT

# Market Type (crypto support)
market_type: crypto

# Asset Selection - Major Cryptocurrencies
symbols:
  - BTCUSDT  # Bitcoin
  - ETHUSDT  # Ethereum

# Backtest Period - 2023 Full Year
date_range:
  start: "2023-01-01"
  end: "2023-12-31"

# Bollinger Band Parameters
# Crypto markets are more volatile, using standard parameters
bollinger_period: 20        # 20-day moving average
bollinger_std_dev: 2.0      # 2 standard deviations

# Squeeze Detection
# Tighter squeeze threshold for crypto volatility
squeeze_threshold_percent: 25   # 25% band width decrease
squeeze_lookback_days: 10       # 10-day lookback

# Risk Management
# Higher stop-loss for crypto volatility
stop_loss_percent: 7.0          # 7% stop-loss (vs 5% for stocks)
max_position_percent: 40.0      # Max 40% per position
max_positions: 3                # Max 3 concurrent positions

# Transaction Costs
transaction_cost_percent: 0.0   # Handled by crypto_config

# Cryptocurrency-Specific Configuration
crypto_config:
  trading_fee_percent: 0.1      # Binance default: 0.1% maker/taker
  min_order_value_usdt: 10.0    # Binance minimum: $10 USDT
  quote_currency: USDT          # Quote currency

# Enhanced Strategy Configuration (Phase 1: Volume + RSI)
enhanced_strategy:
  # Volume Filter (Phase 1)
  volume_filter:
    enabled: true
    window_days: 20
    multiplier: 1.8             # Higher threshold for crypto (vs 1.5 for stocks)

  # RSI Filter (Phase 1)
  rsi:
    enabled: true
    period: 14
    overbought: 70
    oversold: 30

  # MACD Filter (Phase 2 - disabled for this run)
  macd:
    enabled: false
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # ATR Dynamic Stop-Loss (Phase 4 - disabled for this run)
  atr:
    enabled: false
    period: 14
    multiplier: 2.0

  # Confidence Scoring (Phase 3)
  confidence:
    threshold: 50               # Lower threshold for crypto volatility
    scoring:
      base_score: 30            # Bollinger breakout
      volume_score: 30          # Volume confirmation
      rsi_score: 30             # RSI neutral zone
      macd_score: 10            # MACD (disabled)

# File Paths
data_cache_dir: data/cache
log_dir: data/logs
