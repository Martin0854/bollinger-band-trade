# Cryptocurrency Backtest: 2020 Analysis
# Top 20 Coins by 24h Trading Volume

seed_money: 10000
market_type: crypto

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - ASTERUSDT
  - SUIUSDT
  - PAXGUSDT
  - USDEUSDT
  - ZECUSDT
  - XPLUSDT
  - ADAUSDT
  - TRXUSDT
  - LINKUSDT
  - AVAXUSDT
  - TAOUSDT
  - ENAUSDT
  - PEPEUSDT
  - LTCUSDT

date_range:
  start: "2020-01-01"
  end: "2020-12-31"

bollinger_period: 20
bollinger_std_dev: 2.0
squeeze_threshold_percent: 30
squeeze_lookback_days: 10
stop_loss_percent: 5.0
max_position_percent: 10.0
max_positions: 10

crypto_config:
  trading_fee_percent: 0.1
  min_order_value_usdt: 10.0
  quote_currency: USDT

enhanced_strategy:
  volume_filter:
    enabled: true
    window_days: 20
    multiplier: 1.5
  rsi:
    enabled: true
    period: 14
    overbought: 70
    oversold: 30
  macd:
    enabled: false
  atr:
    enabled: false
  confidence:
    threshold: 60

data_cache_dir: data/cache
log_dir: data/logs
