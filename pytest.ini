[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --benchmark-disable

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    contract: marks tests as contract tests requiring external APIs
    benchmark: marks tests as performance benchmarks

# Timezone for Korean market (Asia/Seoul)
env =
    TZ=Asia/Seoul

# Performance benchmark thresholds
[tool:pytest-benchmark]
min_time = 0.000005
max_time = 5.0
# Bollinger Band calculation must complete <100ms for 250 days
# Full backtest must complete <5s for 250 days

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */__init__.py
    */cli/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
