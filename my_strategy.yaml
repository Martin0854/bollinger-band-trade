# 나의 백테스트 전략 설정

# 포트폴리오 설정
seed_money: 10000000  # 초기 자본 (원)

# 종목 선택 (6자리 종목 코드)
stocks:
  - "005930"  # 삼성전자
  - "035720"  # 카카오

# 백테스트 기간
date_range:
  start: "2024-01-01"
  end: "2024-12-31"

# 볼린저 밴드 설정
bollinger_period: 20           # 이동평균 기간 (일)
bollinger_std_dev: 2.0         # 표준편차 배수

# 스퀴즈 감지 설정
squeeze_threshold_percent: 30  # 대역폭 감소 임계값 (%)
squeeze_lookback_days: 10      # 비교 기간 (일)

# 리스크 관리
stop_loss_percent: 5.0         # 손절매 (%)
max_position_percent: 30.0     # 종목당 최대 비중 (%)
max_positions: 5               # 최대 동시 보유 종목 수

# 고급 설정 (선택사항)
risk_free_rate: 0.03           # 무위험 이자율 (연 3%)
transaction_cost_percent: 0.0  # 거래 비용 (%)

# 파일 경로 (선택사항)
data_cache_dir: "data/cache"
log_dir: "data/logs"
