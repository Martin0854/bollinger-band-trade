# Default Backtest Configuration for Bollinger Band Squeeze Strategy
# Korean Stock Market (KOSPI/KOSDAQ)
#
# ========================================================================
# VALIDATED OPTIMAL PARAMETERS (2026-01-08)
# ========================================================================
# These parameters were validated through extensive backtesting:
# - Parameter optimization: 2023-2025 (3 years, 9 experiments)
# - Cross-validation: 2020-2023 (overfitting test)
# - Time-period validation: 6M, 1Y, 3Y periods
#
# Results:
# - 3Y (2023-2025): +91.78% return, 1.36 Sharpe
# - 1Y average: +19.84% (3/3 positive years)
# - 6M average: +5.67% (4/5 positive periods)
# ========================================================================

# Portfolio Settings
seed_money: 10000000  # Initial capital (10 million KRW ≈ $7,500 USD)

# Stock Selection (Korean 6-digit stock codes)
stocks:
  - "005930"  # Samsung Electronics

# Backtest Period
date_range:
  start: "2024-01-01"
  end: "2024-12-31"

# ========================================================================
# Bollinger Band Parameters (OPTIMIZED)
# ========================================================================
# Default: bb_window=20, bb_std=2.0 (conservative)
# Optimized: bb_window=12, bb_std=1.3 (more responsive, validated)
bollinger_period: 12          # 12-day moving average (optimized from 20)
bollinger_std_dev: 1.3        # 1.3 standard deviations (optimized from 2.0)

# Squeeze Detection (OPTIMIZED)
# Default: 0.7 (30% decrease)
# Optimized: 0.55 (45% decrease - more selective)
squeeze_threshold_percent: 55  # Detect 45% band width decrease (optimized)
squeeze_lookback_days: 10      # Over 10-day window

# ========================================================================
# Risk Management (OPTIMIZED)
# ========================================================================
stop_loss_percent: 4.5         # 4.5% stop loss (optimized from 5%)
take_profit_percent: 9.0       # 9.0% take profit target
max_position_size_percent: 10  # Max 10% portfolio allocation per stock
max_positions: 15              # Maximum concurrent positions

# Advanced Settings (Optional)
risk_free_rate: 0.03           # 3% annual (Korean government bonds)
transaction_cost_percent: 0.0  # Zero fees (simplified MVP)

# Initial Positions (optional - start with existing holdings)
initial_positions: {}
# Example:
# initial_positions:
#   "005930":
#     quantity: 10
#     purchase_price: 60000

# ========================================================================
# Market Regime Filter (NEW - Recommended)
# ========================================================================
market_filter:
  enabled: true
  ma_period: 200
  require_above_ma: true

# ========================================================================
# Take Profit Configuration
# ========================================================================
take_profit:
  enabled: true
  target_pct: 9.0
  ratio: 0.5

# ========================================================================
# Advanced Squeeze Detection Configuration
# ========================================================================
squeeze_advanced:
  expansion_threshold_percent: 20.0
  band_touch_tolerance: 0.001

# ========================================================================
# Performance Metrics Configuration
# ========================================================================
metrics:
  trading_days_per_year: 252
  days_per_year: 365

# ========================================================================
# Enhanced Strategy Configuration (Optional - Phase 1-4 Features)
# ========================================================================
#
# IMPORTANT: This section is OPTIONAL for backward compatibility.
# If not specified, the system uses traditional Bollinger Band strategy only.
#
# To enable enhanced features, uncomment and configure below:
#
# enhanced_strategy:
#   # Volume Filter (Phase 1 - User Story 1)
#   # Filters signals based on volume spike detection
#   volume_filter:
#     enabled: false            # Set to true to enable
#     window_days: 20           # 20-day rolling average
#     multiplier: 1.5           # Require 1.5x average volume
#
#   # RSI Filter (Phase 1 - User Story 2)
#   # Avoids overbought/oversold entry points
#   rsi:
#     enabled: false            # Set to true to enable
#     period: 14                # Standard 14-day RSI
#     overbought: 70            # Avoid entry when RSI >= 70
#     oversold: 30              # Oversold threshold
#
#   # MACD Filter (Phase 2 - User Story 3)
#   # Confirms trend direction before entry
#   macd:
#     enabled: false            # Set to true to enable
#     fast_period: 12           # Standard fast EMA
#     slow_period: 26           # Standard slow EMA
#     signal_period: 9          # Signal line EMA
#
#   # ATR Dynamic Stop-Loss (Phase 4 - User Story 5)
#   # Adapts stop-loss to market volatility
#   atr:
#     enabled: false            # Set to true to enable
#     period: 14                # 14-day ATR calculation
#     multiplier: 2.0           # Stop distance = ATR * 2.0
#
#   # Confidence Scoring (Phase 3 - User Story 4)
#   # Multi-indicator signal quality assessment
#   confidence:
#     threshold: 60             # Minimum score to enter (0-100)
#     scoring:
#       base_score: 25          # Bollinger breakout base
#       volume_score: 25        # Volume filter pass
#       rsi_score: 20           # RSI filter pass
#       macd_score: 30          # MACD filter pass
#
# ========================================================================
# Quick Start Examples (Uncomment one to try)
# ========================================================================
#
# Example 1: Phase 1 MVP (Volume + RSI)
# Copy config/examples/phase1_volume_rsi.yaml
#
# Example 2: Phase 2 (Volume + RSI + MACD)
# Copy config/examples/phase2_with_macd.yaml
#
# Example 3: Phase 3 (All filters + Confidence)
# Copy config/examples/phase3_confidence.yaml
#
# Example 4: Phase 4 Full Strategy (All + ATR)
# Copy config/examples/phase4_dynamic_stop.yaml
